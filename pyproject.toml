[project]
name = "blurface"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "numpy>=2.5.5",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "opencv-python>=5.0.0.93",
    "pyside6>=6.12.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyobjc-framework-quartz>=13.0",
    "pyobjc-framework-vision>=13.0",
    "pytest>=9.2.0",
]

[project.scripts]
blurface = "blurface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
